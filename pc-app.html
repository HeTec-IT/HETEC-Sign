// ---------- WebCrypto: Ende-zu-Ende-Verschlüsselung (Schlüssel verlässt nie den Client) ----------
async function generateKey() {
  const key = await crypto.subtle.generateKey({
    name: 'AES-GCM',
    length: 256
  }, true, ['encrypt', 'decrypt']);
  const raw = await crypto.subtle.exportKey('raw', key);
  return {
    key,
    base64: arrayBufferToBase64Url(raw)
  };
}
async function importKeyFromBase64(b64) {
  const raw = base64UrlToArrayBuffer(b64);
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['encrypt', 'decrypt']);
}
async function encryptBytes(key, plainBytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({
    name: 'AES-GCM',
    iv
  }, key, plainBytes);
  const out = new Uint8Array(iv.length + cipher.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(cipher), iv.length);
  return out;
}
async function decryptBytes(key, combined) {
  const iv = combined.slice(0, 12);
  const cipher = combined.slice(12);
  const plain = await crypto.subtle.decrypt({
    name: 'AES-GCM',
    iv
  }, key, cipher);
  return new Uint8Array(plain);
}
function arrayBufferToBase64Url(buf) {
  let binary = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToArrayBuffer(b64url) {
  let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// ---------- Lokale Vertragserkennung (läuft komplett on-device, nichts wird hochgeladen) ----------
const CONTRACT_SIGNALS = [{
  re: /unterschrift\s*(des)?\s*kunden?/i,
  w: 6
}, {
  re: /mobilfunkvertrag/i,
  w: 6
}, {
  re: /dsl[-\s]?vertrag/i,
  w: 6
}, {
  re: /kaufvertrag/i,
  w: 5
}, {
  re: /auftragsbestätigung/i,
  w: 4
}, {
  re: /\bvertrag\b/i,
  w: 2
}, {
  re: /\bauftrag\b/i,
  w: 2
}, {
  re: /widerrufsrecht/i,
  w: 3
}, {
  re: /vertragspartner/i,
  w: 3
}, {
  re: /ort,?\s*datum,?\s*unterschrift/i,
  w: 5
}, {
  re: /einwilligungserklärung/i,
  w: 2
}];
const FILENAME_SIGNALS = [/vertrag/i, /auftrag/i, /contract/i, /kauf/i];
const CONTRACT_THRESHOLD = 6;
async function detectContract(file, pdfjsLib) {
  let score = 0;
  if (FILENAME_SIGNALS.some(re => re.test(file.name))) score += 3;
  const buf = await file.arrayBuffer();
  const pdfBytes = new Uint8Array(buf);
  const pdf = await pdfjsLib.getDocument({
    data: pdfBytes.slice()
  }).promise;
  const pagesToScan = Math.min(pdf.numPages, 4);
  let text = '';
  for (let p = 1; p <= pagesToScan; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += ' ' + content.items.map(i => i.str).join(' ');
  }
  for (const s of CONTRACT_SIGNALS) if (s.re.test(text)) score += s.w;
  return {
    isContract: score >= CONTRACT_THRESHOLD,
    score,
    pageCount: pdf.numPages,
    pdfBytes
  };
}
