// ---------- Automatische Erkennung von Unterschriftsstellen ----------
// Findet allgemeine Unterschriftsbegriffe und berücksichtigt zusätzlich bekannte
// Layout-Sonderfälle. Wichtig: Der erkannte Text ist nur der Anker. Bei Formularen
// wie dem Telekom-SEPA-Mandat liegt das eigentliche Signaturfeld nicht über dem Wort
// "Unterschrift", sondern deutlich rechts daneben.
async function findSignatureAnchors(pdfDoc) {
  const anchorRe = /unterschrift/gi;
  const results = [];

  // Positionsregeln für eindeutig bekannte Formulierungen.
  // x/y sind PDF-Koordinaten; positives y liegt auf der Seite weiter oben.
  const positionRules = [
    {
      // Telekom SEPA-Lastschriftmandat: Beschriftung links, großer Signaturkasten rechts.
      re: /^unterschrift\s+(?:des\s+)?kontoinhabers?\b/i,
      xOffset: 190,
      yOffset: 4,
      type: 'kontoinhaber'
    }
  ];

    const page = await pdfDoc.getPage(i);
    const content = await page.getTextContent();
    const viewport = page.getViewport({ scale: 1 });
    let text = '';
    const spans = [];

    for (const item of content.items) {
      const start = text.length;
      text += item.str + ' ';
      spans.push({
        start,
        end: text.length,
        item
      });
    }

    let match;
    anchorRe.lastIndex = 0;
    while (match = anchorRe.exec(text)) {
      const idx = match.index;
      const span = spans.find(s => idx >= s.start && idx < s.end) || spans[spans.length - 1];
      if (!span) continue;

      // Genug Text nach dem Treffer betrachten, damit auch aufgesplittete PDF-Texte
      // wie "Unterschrift" + "des" + "Kontoinhabers" sicher erkannt werden.
      const context = text.slice(idx, idx + 100).replace(/\s+/g, ' ').trim();
      const rule = positionRules.find(r => r.re.test(context));

      let x = span.item.transform[4];
      let y = span.item.transform[5] + 24; // bewährter Standard für "Unterschrift Kunde" usw.
      let type = 'generic';

      if (rule) {
        x = span.item.transform[4] + rule.xOffset;
        y = span.item.transform[5] + rule.yOffset;
        type = rule.type;
      }

      // Sicherheits-Clamping: Der Mittelpunkt darf nie außerhalb der PDF-Seite liegen.
      x = Math.min(Math.max(x, 80), viewport.width - 80);
      y = Math.min(Math.max(y, 35), viewport.height - 35);

      results.push({
        pageIndex: i - 1,
        x,
        y,
        type
      });
    }
  }

  // Nah beieinanderliegende Treffer derselben Unterschriftsstelle zusammenfassen.
  const deduped = [];
  for (const r of results) {
    const dup = deduped.find(d =>
      d.pageIndex === r.pageIndex &&
      Math.abs(d.x - r.x) < 40 &&
      Math.abs(d.y - r.y) < 20
    );
    if (!dup) deduped.push(r);
  }
  return deduped;
}

// ---------- Alle gesammelten Unterschriften in einem Durchgang einbetten ----------
async function embedSignatures(pdfBytes, signatures, meta) {
  const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
  const pages = pdfDoc.getPages();
  for (const sig of signatures) {
    const pngBytes = dataUrlToUint8Array(sig.dataUrl);
    const pngImage = await pdfDoc.embedPng(pngBytes);
    const pageIndex = Math.min(Math.max(sig.pageIndex, 0), pages.length - 1);
    const page = pages[pageIndex];
    const w = 160,
      h = 60;
    const x = Math.min(Math.max(sig.x - w / 2, 20), page.getWidth() - w - 20);
    const y = Math.min(Math.max(sig.y - h / 2, 30), page.getHeight() - h - 20);
    page.drawImage(pngImage, {
      x,
      y,
      width: w,
      height: h
    });
  }

  // Unsichtbarer Nachweis in den Dokument-Metadaten - kein Stempel im PDF selbst,
  // aber über "Dokumenteigenschaften" in jedem PDF-Reader auslesbar, falls die
  // Unterschrift je angezweifelt werden sollte.
  const now = new Date();
  pdfDoc.setProducer('HETEC Sign');
  pdfDoc.setModificationDate(now);
  pdfDoc.setKeywords(['HETEC-Sign', 'sitzung:' + (meta && meta.sessionRef ? meta.sessionRef : 'unbekannt'), 'unterschrieben:' + now.toISOString(), 'anzahl-unterschriften:' + String(signatures.length)]);
  return pdfDoc.save();
}
