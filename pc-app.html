<!DOCTYPE html>

<style>
  :root {
    --ink-900: #1B2430;
    --ink-700: #2C3A4A;
    --paper-50: #FAFAF8;
    --paper-100: #F0EFEA;
    --paper-200: #E3E1D9;
    --slate-500: #5B6472;
    --slate-300: #9AA1AC;
    --seal-600: #A32F1F;
    --seal-700: #7E2417;
    --confirm-600: #1F7A5C;
    --warn-600: #B5791A;
    --font-display: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-display);
    background: var(--ink-900);
    color: var(--paper-50);
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .app-header { padding: 20px 24px 8px; flex-shrink: 0; }
  .wordmark { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  .wordmark em { font-style: normal; color: var(--seal-600); }
  .ink-underline { width: 90px; height: 8px; display: block; margin-top: 2px; }
  .ink-underline path {
    fill: none; stroke: var(--seal-600); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 160; stroke-dashoffset: 160;
    animation: draw 900ms ease forwards 200ms;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: var(--paper-50); color: var(--ink-900);
    border-radius: 20px 20px 0 0; padding: 32px 24px;
  }
  .screen { max-width: 360px; width: 100%; text-align: center; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate-500); margin: 0 0 6px; }
  .eyebrow.confirm { color: var(--confirm-600); }
  .eyebrow.warn { color: var(--warn-600); }
  h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  .muted { color: var(--slate-500); font-size: 14px; margin: 0 0 20px; }
  .mono { font-family: var(--font-mono); }
  .fineprint { font-size: 12px; margin-top: 16px; }
  button, .file-btn {
    font-family: inherit; font-size: 15px; font-weight: 600; border-radius: 10px;
    padding: 13px 22px; border: none; cursor: pointer; display: block; width: 100%;
    margin-bottom: 10px; transition: transform 80ms ease; position: relative;
  }
  button:active, .file-btn:active { transform: scale(0.98); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, .file-btn:focus-visible { outline: 3px solid var(--seal-600); outline-offset: 2px; }
  .btn-primary { background: var(--seal-600); color: var(--paper-50); }
  .btn-primary:hover:not(:disabled) { background: var(--seal-700); }
  .btn-secondary { background: var(--ink-900); color: var(--paper-50); }
  .btn-ghost { background: transparent; color: var(--slate-500); border: 1px solid var(--paper-200); }
  .btn-link { background: none; color: var(--seal-600); text-decoration: underline; font-weight: 500; padding: 6px; width: auto; margin: 0 auto; }
  .file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .qr { width: 220px; height: 220px; border-radius: 12px; border: 8px solid #fff; margin: 4px auto 20px; display: block; box-shadow: 0 4px 20px rgba(27,36,48,0.14); }
  .pdf-preview { width: 100%; height: 260px; border: 1px solid var(--paper-200); border-radius: 10px; margin-bottom: 16px; background: #fff; }
  .status { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--paper-200); border-top-color: var(--seal-600); animation: spin 800ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status.pulse .spinner { animation: spin 800ms linear infinite, pulse 1600ms ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .idle .ink-mark { margin-bottom: 4px; }
  .ink-svg { width: 140px; height: 30px; }
  .ink-svg path { fill: none; stroke: var(--slate-300); stroke-width: 2.5; stroke-linecap: round; }
  @media (prefers-reduced-motion: reduce) {
    .ink-underline path, .spinner, .status.pulse .spinner { animation: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

const SESSION_TTL_MINUTES = 45; // liegt im geforderten 30–60-Minuten-Fenster

// ---------- Firebase-Bridge robust abwarten (Modul-Script vs. Babel-Script-Timing) ----------
function waitForFirebaseBridge() {
  return new Promise((resolve) => {
    if (window.HeTecFirebase) { resolve(window.HeTecFirebase); return; }
    const iv = setInterval(() => {
      if (window.HeTecFirebase) { clearInterval(iv); resolve(window.HeTecFirebase); }
    }, 30);
  });
}

// ---------- WebCrypto: Ende-zu-Ende-Verschlüsselung (Schlüssel verlässt nie den Client) ----------
async function generateKey() {
  const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
  const raw = await crypto.subtle.exportKey('raw', key);
  return { key, base64: arrayBufferToBase64Url(raw) };
}
async function importKeyFromBase64(b64) {
  const raw = base64UrlToArrayBuffer(b64);
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', true, ['encrypt', 'decrypt']);
}
async function encryptBytes(key, plainBytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);
  const out = new Uint8Array(iv.length + cipher.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(cipher), iv.length);
  return out;
}
async function decryptBytes(key, combined) {
  const iv = combined.slice(0, 12);
  const cipher = combined.slice(12);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
  return new Uint8Array(plain);
}
function arrayBufferToBase64Url(buf) {
  let binary = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function base64UrlToArrayBuffer(b64url) {
  let b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

// ---------- Lokale Vertragserkennung (läuft komplett on-device, nichts wird hochgeladen) ----------
const CONTRACT_SIGNALS = [
  { re: /unterschrift\s*(des)?\s*kunden?/i, w: 6 },
  { re: /mobilfunkvertrag/i, w: 6 },
  { re: /dsl[-\s]?vertrag/i, w: 6 },
  { re: /kaufvertrag/i, w: 5 },
  { re: /auftragsbestätigung/i, w: 4 },
  { re: /\bvertrag\b/i, w: 2 },
  { re: /\bauftrag\b/i, w: 2 },
  { re: /widerrufsrecht/i, w: 3 },
  { re: /vertragspartner/i, w: 3 },
  { re: /ort,?\s*datum,?\s*unterschrift/i, w: 5 },
  { re: /einwilligungserklärung/i, w: 2 },
];
const FILENAME_SIGNALS = [/vertrag/i, /auftrag/i, /contract/i, /kauf/i];
const CONTRACT_THRESHOLD = 6;

async function detectContract(file, pdfjsLib) {
  let score = 0;
  if (FILENAME_SIGNALS.some((re) => re.test(file.name))) score += 3;

  const buf = await file.arrayBuffer();
  const pdfBytes = new Uint8Array(buf);
  const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
  const pagesToScan = Math.min(pdf.numPages, 4);
  let text = '';
  for (let p = 1; p <= pagesToScan; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += ' ' + content.items.map((i) => i.str).join(' ');
  }
  for (const s of CONTRACT_SIGNALS) if (s.re.test(text)) score += s.w;

  return { isContract: score >= CONTRACT_THRESHOLD, score, pageCount: pdf.numPages, pdfBytes };
}

// ---------- UI-Bausteine ----------
function Header() {
  return (
    <header className="app-header">
      <span className="wordmark">HETEC <em>Sign</em></span>
      <svg className="ink-underline" viewBox="0 0 140 10"><path d="M2 6 C 30 2, 60 9, 90 4 S 130 2, 138 6" /></svg>
    </header>
  );
}

function IdleScreen({ onPick }) {
  return (
    <div className="screen idle">
      <div className="ink-mark" aria-hidden="true">
        <svg viewBox="0 0 200 40" className="ink-svg"><path d="M2 30 C 40 5, 70 38, 100 20 S 160 5, 198 22" /></svg>
      </div>
      <h2>Bereit</h2>
      <p className="muted">Ein Vertrag wird automatisch erkannt, sobald die PDF geöffnet wird.</p>
      <label className="btn-primary file-btn">
        PDF manuell öffnen (Test)
        <input type="file" accept="application/pdf" onChange={onPick} />
      </label>
    </div>
  );
}

function StatusScreen({ text, pulse }) {
  return (
    <div className={"screen status" + (pulse ? " pulse" : "")}>
      <div className="spinner"></div>
      <p>{text}</p>
    </div>
  );
}

function NotContractScreen({ fileInfo, onReset, onForceContract }) {
  const [blobUrl, setBlobUrl] = useState(null);
  useEffect(() => {
    if (!fileInfo || !fileInfo.pdfBytes) return;
    const blob = new Blob([fileInfo.pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    setBlobUrl(url);
    return () => URL.revokeObjectURL(url);
  }, [fileInfo]);

  return (
    <div className="screen">
      <p className="eyebrow">Normales Dokument</p>
      <h2>{fileInfo ? fileInfo.name : ''}</h2>
      <p className="muted">Kein Vertrag erkannt – wird nur angezeigt.</p>
      {blobUrl && <iframe className="pdf-preview" src={blobUrl} title="PDF-Vorschau"></iframe>}
      <button className="btn-ghost" onClick={onReset}>Neues Dokument</button>
      <button className="btn-link" onClick={onForceContract}>Doch ein Vertrag? Trotzdem auf Tablet öffnen</button>
    </div>
  );
}

function ContractReadyScreen({ fileInfo, onStart, onReset }) {
  return (
    <div className="screen">
      <p className="eyebrow">Vertrag erkannt</p>
      <h2>{fileInfo ? fileInfo.name : ''}</h2>
      <p className="muted">{fileInfo && fileInfo.pageCount ? fileInfo.pageCount + ' Seiten' : ''}</p>
      <button className="btn-primary" onClick={onStart}>Auf Tablet öffnen</button>
      <button className="btn-ghost" onClick={onReset}>Abbrechen</button>
    </div>
  );
}

function QrScreen({ qrDataUrl, expiresAt }) {
  const [remaining, setRemaining] = useState(0);
  useEffect(() => {
    const tick = () => setRemaining(Math.max(0, Math.floor((expiresAt - Date.now()) / 1000)));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [expiresAt]);
  const mm = String(Math.floor(remaining / 60)).padStart(2, '0');
  const ss = String(remaining % 60).padStart(2, '0');
  return (
    <div className="screen">
      <p className="eyebrow">Bereit zum Scannen</p>
      <h2>QR-Code auf dem Kundentablet scannen</h2>
      {qrDataUrl && <img className="qr" src={qrDataUrl} alt="QR-Code für Tablet" />}
      <p className="mono muted">Gültig noch {mm}:{ss}</p>
    </div>
  );
}

function CompletedScreen({ onPrint, onEmail }) {
  return (
    <div className="screen">
      <p className="eyebrow confirm">Unterschrieben</p>
      <h2>Fertig – wie weiter?</h2>
      <button className="btn-primary" onClick={onPrint}>Drucken</button>
      <button className="btn-secondary" onClick={onEmail}>Per E-Mail senden</button>
      <p className="fineprint muted">Nach Auswahl werden alle Daten dieser Sitzung sofort gelöscht.</p>
    </div>
  );
}

function DoneScreen({ onReset }) {
  return (
    <div className="screen">
      <p className="eyebrow confirm">Abgeschlossen</p>
      <h2>Alle Sitzungsdaten gelöscht</h2>
      <button className="btn-primary" onClick={onReset}>Nächster Kunde</button>
    </div>
  );
}

function ExpiredScreen({ onReset }) {
  return (
    <div className="screen">
      <p className="eyebrow warn">Abgelaufen</p>
      <h2>Sitzung wurde beendet oder ist abgelaufen</h2>
      <button className="btn-primary" onClick={onReset}>Neu starten</button>
    </div>
  );
}

function ErrorScreen({ msg, onReset }) {
  return (
    <div className="screen">
      <p className="eyebrow warn">Fehler</p>
      <h2>{msg || 'Etwas ist schiefgelaufen.'}</h2>
      <button className="btn-primary" onClick={onReset}>Neu starten</button>
    </div>
  );
}

// ---------- Haupt-App ----------
function App() {
  const [phase, setPhase] = useState('idle');
  const [fileInfo, setFileInfo] = useState(null);
  const [session, setSession] = useState(null);
  const [qrDataUrl, setQrDataUrl] = useState(null);
  const [resultBytes, setResultBytes] = useState(null);
  const [errorMsg, setErrorMsg] = useState('');
  const unsubRef = useRef(null);
  const claimedNotified = useRef(false);

  useEffect(() => {
    if ('launchQueue' in window) {
      window.launchQueue.setConsumer(async (launchParams) => {
        if (!launchParams.files || !launchParams.files.length) return;
        const fh = launchParams.files[0];
        const file = await fh.getFile();
        handleIncomingFile(file);
      });
    }
    return () => { if (unsubRef.current) unsubRef.current(); };
  }, []);

  const handleIncomingFile = useCallback(async (file) => {
    setPhase('analyzing');
    setErrorMsg('');
    try {
      const result = await detectContract(file, window.pdfjsLib);
      setFileInfo({ name: file.name, pdfBytes: result.pdfBytes, score: result.score, pageCount: result.pageCount });
      setPhase(result.isContract ? 'contractReady' : 'notContract');
    } catch (e) {
      console.error(e);
      setErrorMsg('PDF konnte nicht gelesen werden.');
      setPhase('error');
    }
  }, []);

  const onPickFile = (e) => {
    const file = e.target.files[0];
    if (file) handleIncomingFile(file);
  };

  const startSession = async () => {
    setPhase('creatingSession');
    try {
      const fb = await waitForFirebaseBridge();
      await fb.ready;
      const user = fb.auth.currentUser;
      const { key, base64 } = await generateKey();
      const encrypted = await encryptBytes(key, fileInfo.pdfBytes);
      const sessionId = crypto.randomUUID();
      const now = Date.now();
      const expiresAt = now + SESSION_TTL_MINUTES * 60 * 1000;

      // Firestore-Dokument ZUERST anlegen – die Storage-Regeln referenzieren es.
      await fb.db.collection('sessions').doc(sessionId).set({
        status: 'pending',
        pcUid: user.uid,
        shopId: window.HETEC_SHOP_ID,
        createdAt: now,
        expiresAt,
        fileName: fileInfo.name,
      });
      await fb.storage.ref(`sessions/${sessionId}/original.enc`).put(encrypted);

      const tabletUrl = `${window.HETEC_TABLET_BASE_URL}#s=${sessionId}&k=${base64}`;
      const canvas = document.createElement('canvas');
      await window.QRCode.toCanvas(canvas, tabletUrl, { width: 320, margin: 1, color: { dark: '#1B2430', light: '#FAFAF8' } });
      setQrDataUrl(canvas.toDataURL());
      claimedNotified.current = false;
      setSession({ id: sessionId, key, expiresAt });
      setPhase('sessionOpen');
      listenToSession(sessionId, key);
    } catch (e) {
      console.error(e);
      setErrorMsg('Sitzung konnte nicht erstellt werden. Firebase-Konfiguration prüfen (siehe SETUP.md).');
      setPhase('error');
    }
  };

  const listenToSession = (sessionId, key) => {
    const fb = window.HeTecFirebase;
    const sessionRef = fb.db.collection('sessions').doc(sessionId);
    unsubRef.current = sessionRef.onSnapshot(async (snap) => {
      if (!snap.exists) { setPhase('expired'); return; }
      const data = snap.data();
      if (data.status === 'claimed' && !claimedNotified.current) {
        claimedNotified.current = true;
        setPhase('claimed');
      }
      if (data.status === 'completed') {
        try {
          const url = await fb.storage.ref(`sessions/${sessionId}/result.enc`).getDownloadURL();
          const resp = await fetch(url);
          const buf = await resp.arrayBuffer();
          const decrypted = await decryptBytes(key, new Uint8Array(buf));
          setResultBytes(decrypted);
          setPhase('completed');
        } catch (e) {
          console.error(e);
          setErrorMsg('Ergebnis konnte nicht entschlüsselt werden.');
          setPhase('error');
        }
      }
    });
  };

  const finishAndCleanup = async () => {
    const fb = window.HeTecFirebase;
    try {
      await fb.storage.ref(`sessions/${session.id}/original.enc`).delete().catch(() => {});
      await fb.storage.ref(`sessions/${session.id}/result.enc`).delete().catch(() => {});
      await fb.db.collection('sessions').doc(session.id).delete();
    } catch (e) { console.error('Cleanup-Fehler', e); }
    if (unsubRef.current) unsubRef.current();
    setPhase('done');
  };

  const handlePrint = () => {
    const blob = new Blob([resultBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const win = window.open(url);
    if (win) win.onload = () => win.print();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    finishAndCleanup();
  };

  const handleEmail = () => {
    const blob = new Blob([resultBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `signiert-${fileInfo.name}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    window.location.href = 'mailto:?subject=' + encodeURIComponent('Unterschriebener Vertrag') +
      '&body=' + encodeURIComponent('Die unterschriebene PDF wurde soeben heruntergeladen – bitte hier anhängen.');
    finishAndCleanup();
  };

  const forceContract = () => setPhase('contractReady');

  const reset = () => {
    setPhase('idle'); setFileInfo(null); setSession(null); setQrDataUrl(null); setResultBytes(null); setErrorMsg('');
  };

  return (
    <div className="app-shell">
      <Header />
      <main className="stage">
        {phase === 'idle' && <IdleScreen onPick={onPickFile} />}
        {phase === 'analyzing' && <StatusScreen text="Dokument wird geprüft…" />}
        {phase === 'notContract' && <NotContractScreen fileInfo={fileInfo} onReset={reset} onForceContract={forceContract} />}
        {phase === 'contractReady' && <ContractReadyScreen fileInfo={fileInfo} onStart={startSession} onReset={reset} />}
        {phase === 'creatingSession' && <StatusScreen text="Sitzung wird vorbereitet…" />}
        {phase === 'sessionOpen' && <QrScreen qrDataUrl={qrDataUrl} expiresAt={session ? session.expiresAt : Date.now()} />}
        {phase === 'claimed' && <StatusScreen text="Kunde liest den Vertrag auf dem Tablet…" pulse />}
        {phase === 'completed' && <CompletedScreen onPrint={handlePrint} onEmail={handleEmail} />}
        {phase === 'done' && <DoneScreen onReset={reset} />}
        {phase === 'expired' && <ExpiredScreen onReset={reset} />}
        {phase === 'error' && <ErrorScreen msg={errorMsg} onReset={reset} />}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
